# PostgreSQL, sized for a 2 GB box.
#
# Install: /etc/postgresql/16/main/conf.d/low-memory.conf
#          (or $PGDATA/conf.d/low-memory.conf)
#
# This instance exists to serve one query, once per build:
#   select region, count(*), max(ordered_at) from orders group by 1
# over a few thousand rows. Postgres is already frugal; the defaults are simply
# sized for a machine that does more than this.
#
# Result: ~35 MB resident, and deploy/build.sh keeps it running only for the
# seconds `evidence sources` needs it.

# The ADBC postgresql driver moves results with COPY ... TO STDOUT (FORMAT
# binary) — see docs/adbc.md. It opens one connection and closes it.
max_connections = 12

# Shared buffers is the one allocation that is reserved up front. 32 MB is
# generous for a table this size and leaves the page cache to the site.
shared_buffers = 32MB
effective_cache_size = 256MB

# Per-operation, and multiplied by concurrent sorts/hashes. The group-by above
# fits in a fraction of this.
work_mem = 4MB
maintenance_work_mem = 32MB

# Background workers each cost a process. There is no parallelism to win on a
# few thousand rows, and on a shared 2 GB box the workers cost more than the
# scan they would split.
max_worker_processes = 2
max_parallel_workers = 0
max_parallel_workers_per_gather = 0
max_parallel_maintenance_workers = 0

# WAL. Nothing here is a system of record — the data is reseeded from the
# project's own parquet by deploy/datasources/seed.sh — so trade durability
# knobs for footprint.
wal_buffers = 1MB
max_wal_size = 256MB
min_wal_size = 64MB
synchronous_commit = off

# Loopback only. Nothing outside the box has any business reaching this.
listen_addresses = '127.0.0.1'
port = 15433

# Autovacuum still runs (a table that is truncated and reloaded every build
# needs it) but with one worker rather than three.
autovacuum_max_workers = 1

log_min_messages = warning
log_statement = 'none'
