# Evidence BI on nginx — the alternative to deploy/Caddyfile.
#
# Caddy is the default because `precompressed br` is built in; nginx serves
# brotli only with a third-party module (ngx_brotli), so this config falls back
# to gzip_static, which IS built in. The practical cost is the duckdb-wasm pair:
# ~15 MB brotli'd vs ~22 MB gzipped, once per new reader.
#
# Install: /etc/nginx/sites-available/evidence  (symlink into sites-enabled)
#
# Everything in the comments of deploy/Caddyfile applies here too — most
# importantly that this server executes no SQL. The site is static and every
# query runs in the reader's browser on duckdb-wasm.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /srv/evidence/current;
    index index.html;

    # Serve the .gz siblings deploy/precompress.sh wrote. Without this nginx
    # would gzip on the fly: CPU per request, and a compression buffer per
    # concurrent reader — the exact per-request memory a 2 GB box cannot spend.
    gzip_static on;

    # on-the-fly gzip only for what has no precompressed sibling
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 5;

    # If ngx_brotli is available, prefer it — it is checked before gzip_static.
    # Harmless when the module is absent only if nginx was built with it; if
    # nginx refuses to start, delete these two lines.
    #brotli_static on;

    sendfile on;
    tcp_nopush on;

    # The two wasm binaries are 33 and 38 MB. Do not buffer them.
    output_buffers 2 512k;

    # --- Cube, same-origin --------------------------------------------------
    # /noodle-cube fetches /cubejs-api/v1/{meta,load,sql} relative to the page.
    # Proxying here is what lets Cube stay bound to loopback.
    location /cubejs-api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cube answers 200 {"error":"Continue wait"} while a query warms and the
        # client polls. Do not cut that short.
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # --- Static -------------------------------------------------------------
    # Hashed and immutable: a returning reader never re-fetches the wasm pair.
    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Regenerated by every build — must not be pinned.
    location /data/ {
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        try_files $uri =404;
    }

    location / {
        # Evidence emits <route>.html alongside directories; try both before 404.
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Deliberately NOT setting COOP/COEP. Evidence ships the non-threaded
    # duckdb-wasm build, and `require-corp` without a CORP header on every
    # subresource blocks the duckdb worker outright — the failure
    # tests/static-server.mjs documents.
    add_header X-Content-Type-Options nosniff always;
    server_tokens off;

    # .wasm must be served as application/wasm or the browser refuses to
    # stream-compile it. nginx has carried that mapping in mime.types since
    # 1.21.5, so nothing is needed here.
    #
    # On an older nginx, add it in the *http* block next to `include mime.types`:
    #
    #     types { application/wasm wasm; }
    #
    # Do NOT put that block here. A `types` directive in a server block replaces
    # the inherited map rather than extending it — every other content type
    # would silently become application/octet-stream.
}
